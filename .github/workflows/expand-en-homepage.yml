name: One-time full English homepage expansion

on:
  push:
    paths:
      - '.github/workflows/expand-en-homepage.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand translated awards patents and publications
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('en.html')
          s = p.read_text(encoding='utf-8')

          awards = '''        <section class="section" id="awards">
          <h2>Selected Awards</h2>
          <div class="section-note">Representative science-and-technology, patent, and paper awards from major utilities, industry organizations, and Jiangsu Province.</div>
          <div class="card">
            <ul class="list">
              <li>[1] Third Prize, Science and Technology Progress Award, State Grid Corporation of China, 2019 — second contributor, <em>Key Technologies and Applications of a Wide-Area Hierarchical Self-Healing System for Urban Backbone Grids</em>.</li>
              <li>[2] Third Prize, Patent Award, State Grid Corporation of China, 2018 — first inventor, <em>A Parameter Identification and Estimation Method for Large Power Grids</em>.</li>
              <li>[3] Third Prize, Jiangsu Electric Power Science and Technology Progress Award, 2019 — second contributor, <em>Key Technologies and Applications of a Wide-Area Hierarchical Self-Healing System for Urban Backbone Grids</em>.</li>
              <li>[4] Third Prize, Patent Award, China Southern Power Grid, 2015 — third inventor, <em>Automatic Transfer Method and Device for Substations with Multiple Incoming Lines</em>.</li>
              <li>[5] Second Prize, Patent Award, Guangdong Power Grid, 2015 — third inventor, <em>Automatic Transfer Method and Device for Substations with Multiple Incoming Lines</em>.</li>
            </ul>
            <details class="more">
              <summary>Additional awards and paper recognitions</summary>
              <ul class="list">
                <li>[6] Third Prize, Science and Technology Progress Award, NARI Group, 2019 — first contributor, <em>Research and Application of a City-Level Smart-Grid Master-Station Automatic Transfer Control System</em>.</li>
                <li>[7] Third Prize, NARI Group “Five Small Innovations” Award, 2019 — first contributor, <em>Research and Development of High-Performance Topology Analysis and Its Application in Power-System Analysis and Control</em>.</li>
                <li>[8] Second Prize, NARI Group Patent Award, 2023 — third inventor, <em>Method for Improving the Computational Speed of Power-System State Estimation</em>.</li>
                <li>[9] Second Prize, Outstanding Paper Award, State Grid Electric Power Research Institute, 2014 — first and corresponding author, <em>Application of Network Automatic Transfer System in Regional EMS</em>.</li>
                <li>[10] Outstanding Paper Award, Power System Automation Committee of the Chinese Society for Electrical Engineering, 2016 — corresponding author, <em>Application of the Parallel Sparse Direct Solver SuperLUMT in State Estimation</em>.</li>
                <li>[11] Jiangsu Province Outstanding Master’s Thesis, 2011 — <em>Research on Adaptive Terminal Sliding-Mode Control for Power Systems</em>.</li>
              </ul>
            </details>
          </div>
        </section>
'''

          patents = '''        <section class="section" id="patents">
          <h2>Selected Granted Invention Patents</h2>
          <div class="section-note">28 granted invention patents through Aug. 2026. The entries below mirror the representative patent list on the Chinese homepage.</div>
          <div class="card">
            <ul class="list">
              <li>[1] CN201410175518.9. <em>A Parameter Identification and Estimation Method for Large Power Grids.</em> Inventors: <strong>Dehu Zou</strong>; Chengming Gong; Yi Wang. Recipient of a Third Prize, State Grid Corporation of China Patent Award.</li>
              <li>[2] CN201210075597.7. <em>Automatic Transfer Method and Device for Substations with Multiple Incoming Lines.</em> Inventors: Bo Chen; Guohao Li; <strong>Dehu Zou</strong>. Recipient of a Third Prize, China Southern Power Grid Patent Award, and a Second Prize, Guangdong Power Grid Patent Award.</li>
              <li>[3] CN201710823171.8. <em>A Method for Improving the Computational Speed of Power-System State Estimation.</em> Inventors: Yuchun Luo; Xin Shan; <strong>Dehu Zou</strong>; Yi Wang; Juanjuan Lu; Xinkui Xi; Long Peng; Yajun Wang; Bin Ma. Recipient of a Second Prize, NARI Group Patent Award.</li>
              <li>[4] CN202511334913.1. <em>An Interpolation-Free Hybrid-Line Simulation Model with Accurate Zero-Sequence Impedance and Its Construction Method.</em> Inventors: <strong>Dehu Zou</strong>; Wei Liu; Jichuan Wang; Facun Liang; Linxi Chen; Qiang Yu.</li>
              <li>[5] CN202411661908.7. <em>A High-Performance Dynamic Waveform Refresh Method for Power-System Real-Time Simulation.</em> Inventors: <strong>Dehu Zou</strong>; Jichuan Wang; Wei Liu; Suyang Zhou; Facun Liang; Linxi Chen.</li>
              <li>[6] CN202410797742.5. <em>A Multi-Level Integrated Graph-and-Model Method and System for Power-System Modelling.</em> Inventors: Jichuan Wang; <strong>Dehu Zou</strong>; Wei Liu; Suyang Zhou; Facun Liang; Linxi Chen.</li>
            </ul>
            <details class="more">
              <summary>Additional representative granted invention patents</summary>
              <ul class="list">
                <li>[7] CN202211175264.1. <em>Multi-Time-Scale Optimal Control Method for Energy Storage Based on LSTM Prediction and Correction.</em> Inventors: Wei Liu; Chengtao Jiang; Wei Gu; <strong>Dehu Zou</strong>.</li>
                <li>[8] CN202110737623.7. <em>Hardware-Accelerated Parallel Multi-Rate Electromagnetic-Transient Real-Time Simulation Method for Converters.</em> Inventors: Wei Gu; Ke Li; Yang Cao; <strong>Dehu Zou</strong>; Xiaoyu Jiang.</li>
                <li>[9] CN202010590540.5. <em>Converter Parameterized Constant-Admittance Modelling Method Based on Cross Initialization.</em> Inventors: Wei Gu; Yang Cao; <strong>Dehu Zou</strong>; Ke Li; Kun Shi.</li>
                <li>[10] CN201811223256.3. <em>A Data-Driven Method and System for Evaluating Reactance Parameters of Ring Power Networks.</em> Inventors: <strong>Dehu Zou</strong>; Yi Wang; Xin Shan; Long Peng; Yuchun Luo; Juanjuan Lu.</li>
                <li>[11] CN201810320169.3. <em>A Method and System for Determining Automatic-Transfer Enable/Disable Combinations Based on Integer Programming.</em> Inventors: <strong>Dehu Zou</strong>; Yingqi Huang; Zongbao Zhang; Zizhao Lin; Jiao Hao; Long Peng; Yi Wang; Lei Zhang; Qian Wang; Haoran Li; Yangyang Yu; Yuhong Ouyang.</li>
                <li>[12] CN201711234334.5. <em>Enable/Disable Method for Automatic Transfer Based on Two-Layer Control.</em> Inventors: <strong>Dehu Zou</strong>; Yi Wang; Xin Shan.</li>
                <li>[13] CN201710545721.4. <em>An Online Estimation Method for the Variance of Time-Varying Measurement Data.</em> Inventors: Chengming Gong; <strong>Dehu Zou</strong>; Lei Li.</li>
                <li>[14] CN201610318342.7. <em>A Method for Using Topology Information in Network Automatic Transfer.</em> Inventors: <strong>Dehu Zou</strong>; Xi Xu; Xin Shan; Jinjun Lu; Dawei Su; Chunlei Xu; Jing Yu; Qibing Zhang.</li>
                <li>[15] CN201510665813.7. <em>A Transformer Parameter Estimation Method.</em> Inventors: Long Peng; Xiaoqiang Sun; Xin Gao; <strong>Dehu Zou</strong>; Guixiang Zhai; Li Zhang; Qing Yang; Yi Wang; Xin Shan; Jinjun Lu.</li>
                <li>[16] CN201510418589.1. <em>An Online Filtering Method for Telemetry Data in Dispatch Systems.</em> Inventors: Yi Wang; <strong>Dehu Zou</strong>; Zemei Dai; Xin Shan; Dawei Su; Chunlei Xu.</li>
                <li>[17] CN201210226842.X. <em>An Adaptive Generation Method for Wide-Area Automatic Transfer Models.</em> Inventors: <strong>Dehu Zou</strong>; Zhongda Wang; Liufei Xu; Chengming Gong; Lei Li; Wenbin Zhang; Liangliang Ge.</li>
                <li>[18] U.S. patent publication, <em>Converter Parameterized Constant Admittance Modeling Method Based on Cross Initialization</em>, published 2022-09-20. Inventors: Wei Gu; Yang Cao; <strong>Dehu Zou</strong>; Ke Li; Kun Shi.</li>
              </ul>
            </details>
          </div>
        </section>
'''

          papers = '''        <section class="section" id="papers">
          <h2>Selected Publications</h2>
          <div class="section-note">34 published papers through Sep. 2026. The list mirrors the representative publications shown on the Chinese homepage, with English translations of Chinese titles for international readers.</div>
          <div class="card">
            <ul class="list">
              <li>[1] <strong>Zou, D.</strong>; Gu, W.; Liu, W. Deadline-Deterministic Sparse Matrix Updates with Versioned Factor Banks for Real-Time Distribution Network EMT Simulation. <em>Electronics</em> 2026, 15, 3934. https://doi.org/10.3390/electronics15173934.</li>
              <li>[2] <strong>Zou, D.</strong>; Gu, W.; Liu, W. Interpolation-Free Hybrid Bergeron–π Line Model with Accurate Zero-Sequence Impedance. <em>Energies</em> 2026, 19, 1164. https://doi.org/10.3390/en19051164.</li>
              <li>[3] <strong>D. Zou</strong>, K. Hu, W. Liu and W. Gu, “Efficient Controller Simulation for Power Systems Based on Hybrid Topology-AI Simulation Framework,” 2025 IEEE 3rd International Conference on Power Science and Technology (ICPST), Kunming, China, 2025, pp. 216-221, doi: 10.1109/ICPST65050.2025.11089396.</li>
              <li>[4] <strong>Dehu Zou</strong>, Xi Xu, Xin Shan, et al. “Automatic Transfer System Based on Centralized Security Checking and Distributed Control.” <em>Power System Protection and Control</em>, 2017, 45(21): 140–146. [Chinese]</li>
              <li>[5] Quanwei Chen, Chengming Gong, Jinquan Zhao, Yi Wang, <strong>Dehu Zou (corresponding author)</strong>. “Application of the Parallel Sparse Direct Solver SuperLUMT in State Estimation.” <em>Automation of Electric Power Systems</em>, 2017, 41(03): 83–88. [Chinese]</li>
            </ul>
            <details class="more">
              <summary>Additional representative publications</summary>
              <ul class="list">
                <li>[6] <strong>Dehu Zou</strong>, Zhongda Wang, Liufei Xu, et al. “Application of a Network Automatic Transfer System in Regional EMS.” <em>Automation of Electric Power Systems</em>, 2013, 37(17): 106–111. [Chinese]</li>
                <li>[7] <strong>Dehu Zou</strong>, Baohua Wang. “Backstepping Terminal Sliding-Mode Coordinated Control of SVC and Generator Excitation.” <em>Power System Technology</em>, 2011, 35(04): 108–111. DOI:10.13335/j.1000-3673.pst.2011.04.023. [Chinese]</li>
                <li>[8] <strong>Dehu Zou</strong>, Baohua Wang. “Adaptive Robust Terminal Sliding-Mode Excitation Control for Multi-Machine Power Systems.” <em>Electric Power Automation Equipment</em>, 2010, 30(12): 79–82. [Chinese]</li>
                <li>[9] <strong>Dehu Zou</strong>, Baohua Wang. “Adaptive Terminal Sliding-Mode Integrated Control of Turbine Generators.” <em>Power System Protection and Control</em>, 2010, 38(17): 33–36+42. [Chinese]</li>
                <li>[10] <strong>Z. Dehu</strong>, S. Yulin and W. Baohua, “Terminal Sliding Mode Valving Controller Based on COI Signal for Multi-machine Power Systems,” 2010 International Conference on Electrical and Control Engineering, Wuhan, China, 2010, pp. 4346–4349.</li>
              </ul>
            </details>
          </div>
        </section>
'''

          def replace_between(text, start_id, next_id, replacement):
              pattern = rf'        <section class="section" id="{start_id}">.*?(?=        <section class="section" id="{next_id}">)'
              out, n = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Could not replace {start_id} section')
              return out

          s = replace_between(s, 'awards', 'contact', awards)
          s = replace_between(s, 'patents', 'papers', patents)
          pattern = r'        <section class="section" id="papers">.*?(?=      </main>)'
          s, n = re.subn(pattern, papers, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not replace papers section')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify full English page
        shell: bash
        run: |
          grep -F 'CN201210226842.X' en.html
          grep -F 'Jiangsu Province Outstanding Master’s Thesis' en.html
          grep -F 'Terminal Sliding Mode Valving Controller Based on COI Signal' en.html
          grep -F 'hreflang="zh-CN"' en.html

      - name: Commit and remove this one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/expand-en-homepage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en.html .github/workflows/expand-en-homepage.yml
          git commit -m "Complete English personal homepage translation"
          git push
