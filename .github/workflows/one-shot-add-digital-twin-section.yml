name: One-shot add digital twin section

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-add-digital-twin-section.yml'

permissions:
  contents: write
  pages: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Insert digital twin discussion before conclusion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          p = Path('_includes/system-engineering-legacy.md')
          text = p.read_text(encoding='utf-8')
          marker = '## 九、结语：把复杂性变成可以承担的责任'
          if marker not in text:
              raise SystemExit('Conclusion marker not found')

          payload = '' 
          section = base64.b64decode(payload).decode('utf-8')
          text = text.replace(marker, section, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit article revision and remove one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-add-digital-twin-section.yml
          git add _includes/system-engineering-legacy.md
          git commit -m "Add digital twin discussion to power system engineering article"
          git push

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28"
