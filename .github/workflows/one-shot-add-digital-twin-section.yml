name: One-shot add digital twin section

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-add-digital-twin-section.yml'

permissions:
  contents: write
  pages: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Insert digital twin discussion before conclusion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('_includes/system-engineering-legacy.md')
          text = p.read_text(encoding='utf-8')
          marker = '## 九、结语：把复杂性变成可以承担的责任'
          if marker not in text:
              raise SystemExit('Conclusion marker not found')

          section = r'''## 九、数字孪生辨析：不是三维展示，而是数字表示与真实系统的持续对应

### 1. 数字孪生与系统工程不是同一个层次

近年来，“数字孪生”几乎成为复杂工业系统都会使用的术语。在电力行业中，它有时指三维可视化平台，有时指实时数据看板、在线仿真、设备健康管理，甚至泛指一切“把现场搬到计算机里”的工作。这些应用都可能有价值，但若概念过宽，就容易掩盖真正困难的工程问题。

从本文的主线看，系统工程与数字孪生有很大的交集，却并不等同。系统工程回答的是：面对一个复杂系统，如何确定目标、划定边界、建立模型、组织接口、处理反馈与约束、验证结论，并在运行反馈中持续演化。数字孪生回答的则是：如何建立一个能够持续反映真实对象状态的数字表示，使模型、数据与现实之间形成可用于分析、预测、决策和控制的对应关系。

因此，数字孪生可以看作系统工程在数字化条件下的一种重要实现形式，尤其适用于运行、维护和持续优化阶段；但它不能替代系统工程本身。没有需求澄清、边界划分、接口定义、配置管理、验证路径和责任分工，数字孪生很容易成为一个“看起来先进”的展示系统，却不能成为可靠的工程能力。

### 2. 一张表看清二者的异同

| 维度 | 本文所说的系统工程 | 数字孪生 |
|---|---|---|
| 核心问题 | 如何把复杂对象设计、集成、验证、运行并持续演化 | 如何建立与真实对象持续对应的数字表示 |
| 生命周期 | 覆盖需求、设计、建设、运行、维护乃至退役 | 常聚焦运行与维护，也可向设计建设阶段延伸 |
| 出发点 | 任务、场景、需求、指标与约束 | 被孪生对象、使用目的、状态数据与模型 |
| 边界 | 明确系统、环境、接口和责任的范围 | 明确哪些对象、状态、参数和事件需要保持数字对应 |
| 模型 | 为特定问题建立适当抽象，不要求把现实全部搬入模型 | 强调模型能够随现实状态、参数和配置持续更新 |
| 接口 | 同时包括物理、控制、信息和组织接口 | 更强调数据、状态、模型和控制接口的在线一致性 |
| 反馈 | 包括设计反馈、试验反馈、运行反馈和组织反馈 | 特别强调物理世界与数字世界之间的双向反馈 |
| 验证 | 证明需求、模型、实现和用途之间具有证据关系 | 证明数字表示对真实对象在指定用途下足够一致 |
| 典型产出 | 可实施、可运维、可追责的系统能力 | 可观测、可分析、可预测、可辅助决策的数字能力 |
| 常见误区 | 只讲流程，不追问物理机理和技术证据 | 只做界面和数据接入，不维护模型与现实的一致性 |

二者更接近“总体工程方法”与“数字化实现能力”的关系。系统工程给复杂性提供组织骨架，数字孪生则试图把其中一部分关键关系——尤其是运行状态、模型、配置与反馈——持续映射到数字空间中。

### 3. 电力系统数字孪生的难点不在“三维”，而在“对应”

对电力系统而言，数字孪生真正困难的地方，不是能不能画出变电站、输电线路和厂站设备的三维模型，也不是能不能让屏幕上的断路器随遥信开合。真正困难的是：数字世界中的对象，是否真的与当前电网的**拓扑、参数、状态、约束、控制逻辑和使用场景**保持一致。

某个母线在画面上显示带电，是否对应当前这一时刻、这一拓扑和这一运行方式？某台机组显示“可调”，是否意味着它当前确有上调裕度、相关控制没有退出、执行机构没有到限、热工或能量约束没有成为主导？某个在线稳定分析给出“安全”，其网络模型、动态参数、保护逻辑、控制策略与现场配置是否属于同一有效基线？这些问题若回答不了，那么所谓“孪生”只是把图形、数据和算法放到了同一个界面，而没有形成可验证的物理对应。

这也是为什么电力系统中的数字孪生不能简单理解为“实时仿真”。实时数据可以驱动一个错误模型，正确模型也可能读取过期数据；两者还可能各自正确，却来自不同拓扑版本或不同时间断面。只有对象、时间、配置、模型和用途能够共同对齐，数字表示才具有工程意义。

### 4. 为什么很多“数字孪生”项目会退化成漂亮的三维界面

很多项目最后退化成三维展示，并不是因为三维技术没有价值，而是因为建设顺序和责任结构发生了偏移。三维界面最容易被看见，也最容易形成明确的验收项；而真正决定孪生可信度的模型维护、数据治理、配置同步、验证确认和长期责任，往往跨专业、跨部门，投入持续、效果又不容易在一次演示中体现。若项目管理只追求可见成果，系统便自然向“展示层”收缩。

**第一，需求容易从“支持什么决策”滑向“展示什么效果”。** 如果立项首先讨论大屏、三维场景和可视化交互，而没有明确平台要支持哪些运行判断、哪些分析任务、哪些控制决策，那么最容易量化和验收的视觉效果就会替代真正的工程目标。项目完成时可能“什么都能看”，却说不清哪些结果可以进入调度或运维决策。

**第二，数据接入容易被误认为状态一致。** 电力系统的真实状态不是某一个数据库天然给出的对象，而是拓扑、量测、设备台账、控制状态、保护与稳控配置、时标和版本共同一致的结果。SCADA 遥测可能是这一秒的，拓扑可能停留在上一轮刷新，设备模型来自半年前的台账，控制策略又由另一套系统维护。每个数据项都可能合法，组合起来却未必对应一个真实存在的电网状态。

**第三，实时数据容易掩盖静态模型的老化。** 很多项目把“数据在跳”视为孪生保持鲜活的证据，却没有同等重视模型结构、动态参数、限值、保护逻辑和控制策略的持续更新。实时数据如果不断输入一个已经失真的模型，只会更及时地得到失真的结论。模型与现场之间的偏差不会因为刷新频率提高而自动消失。

**第四，模型更新缺少验证与发布机制。** 现场设备变更、控制器升级、保护定值调整、通信配置修改以后，数字侧是否同步，不能只靠文件被替换来证明。新的模型需要结构检查、基准算例、跨模型比较、历史事件回放或其他独立证据，再按用途发布。若缺少这种过程，数字世界会逐渐积累“看不出来”的配置债务，直到某次事故或分析失效才暴露出来。

**第五，建设责任明确，长期维护责任却常常模糊。** 软件供应商可以交付平台，三维建模团队可以交付场景，接口团队可以交付点表，但运行几年以后，谁维护动态参数？谁确认保护逻辑与现场一致？谁判断一个设备状态变更是否需要重新验证？谁决定某类模型已经不能继续用于在线安全分析？如果这些责任没有落到具体角色，项目验收完成之日往往就是孪生开始与现实脱节之时。

**第六，缺少用真实事件反向修正数字世界的闭环。** 真正的数字孪生应当能够从扰动、故障、试验和日常运行中不断发现模型偏差。某次频率事件暴露了调速器模型不准，某次电压扰动暴露了无功限值错误，某次保护动作暴露了时序或拓扑配置不一致，这些都应转化为模型修订、回归测试和重新发布。如果事件只形成事故报告，而数字模型仍按原样继续运行，所谓“孪生”并没有真正学习。

因此，很多数字孪生项目之所以退化，不是因为它们做了三维，而是因为它们**只剩下了三维**；不是因为它们接入了数据，而是因为没有把数据、模型、配置、验证和责任组织成闭环。现场设备、运行方式和控制策略持续变化，而数字侧若缺乏同等强度的持续维护，脱节不是偶然异常，而是必然趋势。

### 5. 判断一个电力系统数字平台是否真正“孪生”

与其争论某个平台是否应该使用“数字孪生”这个名称，不如检查它能否回答几个更具体的问题：孪生对象是什么，边界在哪里；量测、拓扑、模型和配置是否能够形成一致断面；模型怎样更新、由谁批准；结果用什么现场事件或独立方法验证；平台输出可以支持哪些决策，又明确不能支持哪些决策；发现模型与现场不一致以后，谁负责降低结果使用等级、修正模型并重新发布。

如果这些问题能够持续得到具体回答，那么三维界面只是表达层之一，数字孪生背后存在真正的工程闭环。反之，即使画面与现场高度相似、数据刷新到毫秒级，也只能证明系统“显示得像”，不能证明它“理解得对”。

回到本文的主线，数字孪生并没有超越系统工程，反而更加依赖系统工程：**需求决定孪生什么，边界决定对应到哪里，模型和接口决定怎样表达现实，反馈与约束决定数字结论是否仍对应真实行为，验证决定这些结论能否被相信，而运行反馈决定数字世界是否能够跟随真实系统继续演化。**

数字孪生真正值得追求的，不是“把真实电网在屏幕里再造一遍”，而是在明确边界内，让数字表示与真实电网保持足够可信、可验证、可维护、可用于决策的对应关系。

## 十、结语：把复杂性变成可以承担的责任'''

          text = text.replace(marker, section, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit article revision and remove one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-add-digital-twin-section.yml
          git add _includes/system-engineering-legacy.md
          git commit -m "Add digital twin discussion to power system engineering article"
          git push

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28"
