name: Finalize device engineering integration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/revise-system-engineering-device.yml'

permissions:
  contents: write
  pages: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate chapter into evidence chain and conclusion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('论系统工程.md')
          text = p.read_text(encoding='utf-8')

          replacements = [
              ('## 十、把六个案例收束为一条工程证据链', '## 十、把七个案例收束为一条工程证据链'),
              ('## 十、结语：把复杂性变成可以承担的责任', '## 结语：把复杂性变成可以承担的责任'),
              ('回看全文，频率响应、电压控制、保护与安全防线、分层仿真、模型管理和工业软件表面上属于不同专业，底层却反复出现同一类问题：边界怎样划定，模型保留什么，接口传递什么，约束在哪里生效，结论凭什么可信，系统变化以后谁负责重新评价。',
               '回看全文，频率响应、电压控制、保护与安全防线、装置工程、分层仿真、模型管理和工业软件表面上属于不同专业，底层却反复出现同一类问题：边界怎样划定，模型保留什么，接口传递什么，约束在哪里生效，结论凭什么可信，系统变化以后谁负责重新评价。'),
              ('局部技术可以非常成熟，系统结果仍取决于它们怎样连接。分层控制需要处理耦合，三道防线需要处理资源共享和失效路径，多类模型需要处理适用范围和接口一致性，数字孪生则把模型、数据、配置和运行反馈放进更连续的数字闭环。',
               '局部技术可以非常成熟，系统结果仍取决于它们怎样连接。分层控制需要处理耦合，三道防线需要处理资源共享和失效路径，装置工程需要处理系统需求与本体约束之间的能力边界，多类模型需要处理适用范围和接口一致性，数字孪生则把模型、数据、配置和运行反馈放进更连续的数字闭环。')
          ]
          for old, new in replacements:
              if old not in text:
                  raise RuntimeError(f'Expected text not found: {old[:40]}')
              text = text.replace(old, new, 1)

          anchor = '| 故障后防御路径有效 | 实际切除时间、后备拓扑、共享资源和通信异常 | 端到端试验、时序分析、稳定计算与事件记录 | 保护、稳控、通信、调度及运维人员 |\n'
          device_row = '| 装置能够在系统中承担预期功能 | 系统场景、功能分配、平台与接口、硬件能力边界以及限流和失效状态 | 需求追溯、架构评审、整机与 HIL 试验、现场联调及运行事件 | 系统分析、装置研发、试验、厂站及运维人员 |\n'
          if device_row not in text:
              if anchor not in text:
                  raise RuntimeError('Evidence table insertion anchor not found.')
              text = text.replace(anchor, anchor + device_row, 1)

          p.write_text(text, encoding='utf-8')

          sm = Path('sitemap.xml')
          if sm.exists():
              sitemap = sm.read_text(encoding='utf-8')
              target = '<loc>https://zoudehupowersystem.github.io/%E8%AE%BA%E7%B3%BB%E7%BB%9F%E5%B7%A5%E7%A8%8B.html</loc>'
              pos = sitemap.find(target)
              if pos >= 0:
                  tail = sitemap[pos:pos+300]
                  tail2 = tail.replace('<lastmod>2026-09-15</lastmod>', '<lastmod>2026-09-16</lastmod>', 1)
                  sitemap = sitemap[:pos] + tail2 + sitemap[pos+len(tail):]
                  sm.write_text(sitemap, encoding='utf-8')
          PY

      - name: Commit final integration and rebuild Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- '论系统工程.md' sitemap.xml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '论系统工程.md' sitemap.xml
          git commit -m "Integrate device engineering into evidence chain and conclusion [skip ci]"
          git push

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28"
