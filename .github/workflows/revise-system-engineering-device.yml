          text = text.replace(placeholder, new_intro, 1)

          chapter = r'''## 五、装置工程：装置为什么不能脱离系统单独设计

### 1. 装置首先是系统成员，然后才是一件产品

前面讨论频率、电压和安全防线时，已经反复涉及调速器、励磁系统、保护装置、安全自动装置、无功补偿设备和变流器。这些对象有一个共同特点：系统功能最终必须通过具体装置落到真实电网。频率支撑需要测量频率并改变有功，电压控制需要感知电压和无功状态并驱动执行机构，保护需要完成采样、判断、出口和断路器动作。算法给出了行为规则，装置则把量测、计算、通信和执行连接起来，使这些规则真正作用于物理系统。

但装置不能因此被理解成算法外面套了一层硬件。它接入电网以后，输入来自互感器、传感器、通信网络和上级控制系统，输出又会改变一次设备和其他控制器所处的条件；它的时延、限值、失效方式和恢复过程都会进入系统动力学。对装置而言一次正确动作，可能只是系统事件路径中的一个环节；对系统而言真正重要的是，许多装置在同一场景下共同作用以后，能否把电网带到可接受状态。

因此，装置需求不能只从产品内部产生。采样精度、计算周期、通信带宽、最大输出和环境适应性当然重要，但这些参数只有放回系统场景才有意义。一个保护装置需要多快，是因为故障持续时间会影响设备损伤和系统稳定；一个变流器需要提供多大的短时电流，是因为故障期间的电压支撑、保护配合和故障后恢复提出了要求。装置首先承担系统责任，然后才把这种责任分解成硬件、软件和算法指标。

这也意味着，评价装置不能只问“这台设备性能是否足够好”，还要问它在系统中承担什么责任、依赖哪些外部条件、与哪些对象交换信息、约束生效以后怎样改变行为，以及这些变化是否已经被上层系统和其他设备正确认识。**局部性能属于装置，系统效果来自装置与环境之间的关系。**

### 2. 装置内部本身也是一个系统

把视角缩小到一台装置内部，又会看到与整个电力系统相似的结构。现代保护、控制和变流器控制装置通常同时包含测量与采样、处理器或 FPGA、存储与时钟、实时软件、控制算法、数字和模拟 I/O、通信、电源、散热、电磁兼容、网络安全、自检以及维护接口。它们分别由不同专业设计，却必须在同一个机箱、同一套时间约束和同一条故障链中共同工作。

这种耦合使装置研发不能采用“各专业分别做到最好，最后组装起来”的思路。提高采样频率可能增加计算和数据搬运压力，复杂算法可能改变最坏执行时间和内存需求，更换处理器可能牵动驱动、工具链、网络安全机制和长期备件策略，增加冗余又可能引入状态一致和切换控制问题。硬件、软件、控制、结构、热设计、制造和运维之间都存在接口，局部改进可能把代价转移给另一个环节。

系统工程在装置层面的意义，正是把这些局部选择放在共同目标下处理。产品功能要分解，功能要分配到硬件和软件，模块之间要有明确接口，资源和时序要有预算，异常和降级要在架构阶段考虑，设计变更还要能够追溯到需求和验证证据。ISO/IEC/IEEE 15288 所强调的生命周期思想并不只适用于大型工程；当一台装置包含多个相互依赖的技术对象，并且需要经历设计、实现、集成、验证、运行、维护和退役时，它本身已经是一个需要系统工程方法管理的系统。[[1]](#ref-1)

### 3. ARM 还是 PLC，本质上是系统架构与功能分配问题

装置研发很容易从一个具体技术问题开始，例如采用 ARM 路线还是 PLC 路线。严格地说，两者并不处在完全相同的抽象层次：ARM 首先是一类处理器体系结构和计算平台路线，PLC 则是一类具有工业 I/O、实时控制、编程工具和维护生态的控制器产品。把问题简单写成二选一，容易把真正需要决定的系统架构隐藏起来。

平台选择应该由功能和场景反推。对于直接参与变流器高速采样、调制和电流闭环的任务，确定性时延、底层外设访问以及与 FPGA、ADC、PWM 等单元的协同可能构成核心约束，定制嵌入式平台因而具有明显价值。对于辅助设备顺序控制、联锁、大量离散 I/O 或现场维护要求较高的功能，成熟 PLC 或类似工业控制平台的工程工具、标准接口和维护体系又可能更合适。两类任务还可以存在于同一个设备或同一个站内系统中，由不同层级分别承担，再通过经过定义的接口形成整体。

因此，算力并不是唯一尺度。实时性、I/O 形态、电磁环境、可靠性、可测试性、网络安全、器件供应周期、开发工具、人员能力、现场维护和全寿命成本，都可能改变技术路线。若为了追求通用维护而把需要严格确定性时延的高速控制放到不合适的平台上，系统功能会受损；反过来，若所有简单逻辑都采用高度定制的嵌入式实现，也可能把长期维护和升级成本留给后续组织。

这里真正需要设计的不是 ARM 与 PLC 谁更先进，而是哪些功能应放在哪个层级，层级之间交换什么信息，某一层失效以后其他层如何感知和接管，以及十年以后这套架构还能否被维护。平台选择由此从元器件问题上升为系统架构问题。

### 4. 装置能力与系统需求之间既有合作，也有约束博弈

装置作为系统成员，并不意味着它可以无条件执行系统提出的任何要求。系统和装置的总体目标都是安全可靠运行，但它们面对的局部约束并不相同。系统关心频率、电压、稳定和供电连续性，装置还必须同时考虑器件电流、电压、温升、绝缘、能量、机械应力和寿命。两组目标大多数时候相互一致，在极端工况下却可能发生直接冲突。

构网型变流器在低电压故障期间的电流支撑就是一个典型例子。从电网角度看，希望变流器在故障期间不要立即退出，并在能力允许时提供较强的电流支撑，因为这种行为会影响局部电压、系统稳定、保护配合以及故障后的恢复。但从装置内部看，大电流会增加 IGBT 等功率器件以及母排、滤波器和散热系统的应力；短时间能够承受的运行点，并不等于可以长时间或高频次重复运行。若系统只把变流器视为理想电流源，就可能提出硬件无法持续满足的要求；若装置只按最保守的本体保护原则设计，又可能在系统最需要支撑的时候过早退出。

这类问题不能靠简单规定“系统优先”或“设备优先”解决，而应在设计阶段明确能力边界和优先级。正常工况下装置按照系统目标运行，扰动期间可以在经过验证的范围内释放短时能力，接近硬件安全边界时本地限流和保护必须具有明确权限；与此同时，上层系统需要知道装置已经进入何种限制状态、剩余能力有多少，以及这种能力还能维持多久。装置的可用能力还可能随着温度、运行历史、储能荷电状态和故障状态变化，因此系统不能长期把铭牌额定值当成任何时刻都可调用的固定资源。

这种关系可以理解为装置与系统之间的合作与博弈，但它不是两个主体彼此对抗，而是不同层级在共同目标下进行约束协调。系统研究可能发现某类扰动需要更强或更持久的支撑，从而反过来推动功率器件、散热、储能或并联结构的设计；装置的物理边界又会迫使系统重新安排其他资源、控制优先级和保护策略。系统需求进入硬件设计，硬件约束重新进入系统设计，闭环才真正形成。

### 5. 接口决定装置能力能否成为系统能力

装置之间通过接口组成系统。这里的接口不只是端子、报文和通信协议，还包括信息的物理含义、量纲、时标、有效期、控制权限以及异常情况下的责任转移。许多现场问题并不是某台装置完全失效，而是接口两端对同一件事情作出了不同解释：上层认为指令已经下发就等于任务已经完成，下层实际上因为限值没有执行；设备认为发送了状态量就已经完成告知，上层却不知道这个状态量已经过期；两个控制器都具有独立闭环，却没有定义谁在模式切换时拥有最终控制权。

第三章讨论 AVC 时已经看到类似问题。上层给出的无功或电压目标可能因为设备进入限制而无法实现，如果下层只上传实际值而不表达“当前不可调”和“约束正在生效”，上层就可能继续积累一个物理上已经不可行的命令。把视角推广到装置工程，同样的原则适用于频率支撑、储能功率、构网变流器电流能力以及保护和安全自动装置：系统不仅需要知道装置现在输出了多少，还需要知道它当前处于什么模式、哪些能力仍然可用、哪些命令已经被本地约束覆盖。

因此，一个完整接口应该让系统能够区分命令接收、命令执行和目标实现，也应该使装置能够表达能力下降、数据失效和控制权变化。多厂家系统尤其如此。各设备单独满足自己的通信规范，只能证明报文可以交换；只有当状态语义、时序、异常处理和控制责任也得到一致定义，装置的局部能力才真正成为可依赖的系统能力。

### 6. 装置研发过程本身就是一条系统工程证据链

如果装置是系统中的一个子系统，那么研发过程就不能从选处理器、画电路板或编写控制代码开始。首先需要从电网场景说明装置为什么存在、承担什么功能、在正常和异常条件下需要表现出什么行为，再把这些系统级要求逐步分解到测量、计算、控制、保护、通信、电源和结构等子系统。架构形成以后，各专业才能进入详细设计；模块完成以后，又需要沿着相反方向逐层集成，确认局部实现最终仍然支持最初的系统目标。

这个过程与前文反复强调的“工程主张需要证据”完全一致。单元测试可以证明某段软件在规定输入下工作，板级测试可以证明硬件接口和资源满足要求，整机试验可以检查装置功能和环境适应性，控制器硬件在环可以把真实控制器的采样、计算、通信和输出时序放入闭环，现场联调则进一步加入真实互感器、通信网络、一次设备和运行方式。证据是逐层增加的，但不同证据回答的问题不同。HIL 与仿真模型一致，并不能自动证明功率器件的长期可靠性；型式试验通过，也不能证明多台装置接入以后一定不存在控制相互作用。

失效同样需要在研发阶段进入系统设计。电源故障、时钟异常、通信中断、传感器失真、存储损坏、软件死锁和模块退出，不应该等到现场出现以后再决定怎样处理。所谓安全状态也不能脱离系统定义：一台设备立即闭锁可能保护本体，却可能使电网突然失去关键支撑；继续保持最后一次命令可能避免突变，却可能在系统条件已经变化后形成新的风险。应当先分析失效对上层系统的后果，再决定冗余、诊断、降级、接管和退出策略。

因此，装置研发的完整性不表现为测试项目越多越好，而在于需求、架构、实现和验证之间能够追溯。每一项关键系统要求最终由哪个模块实现、用什么试验证明、修改以后哪些证据必须重新建立，都应该能够回答。这样，装置研发才从若干专业工作的集合变成一个能够闭合的工程过程。

### 7. 部署和运行不是研发的终点，而是系统集成与再次反馈

实验室中的装置面对的是经过设计的接口和受控条件，进入现场以后却会接触真实 CT、VT、传感器、交换机、直流电源、接地、电磁环境以及其他厂家的设备，还会进入已经运行多年的定值、点表、通信配置和操作流程。单台装置完成出厂试验，只说明它在规定条件下具备某些能力；部署要解决的是这些能力能否在具体系统中被正确调用。因此，投运本质上仍然是系统集成，需要确认量测、时钟、控制方向、通信语义、保护配合、故障切换和运行权限在真实环境下保持一致。

装置投运以后，系统边界还会继续变化。固件升级、控制参数调整、功率模块更换、通信配置修改以及处理器或板卡替代，都可能改变装置行为。同一个产品型号在不同硬件、固件和参数版本下，未必还是系统模型中的同一个对象。如果现场已经修改限流策略，而离线稳定或 EMT 模型仍保留旧逻辑，数字系统与物理系统之间就出现了新的版本分叉。装置版本因此应与模型、参数和试验证据一起进入配置管理，而不能只在设备台账里记录一个型号和序列号。

生命周期还会把研发阶段不容易显现的问题重新带回来。处理器和通信芯片可能停产，操作系统和第三方软件需要修补漏洞，开发工具和维护人员会变化，新的系统功能又可能要求旧装置增加能力。某个方案在投产时具有最高性能，并不意味着它在十五年以后仍然具有最高系统价值；可维护性、供应链、升级路径和知识传承同样属于架构决策的一部分。

更重要的是，运行本身应成为下一轮研发的输入。一次误动、拒动、通信异常、控制饱和或与模型不一致的响应，不应只在本专业内部形成故障报告，而应重新检查系统需求、接口假设、装置设计、仿真模型和测试场景。现场事实能够进入模型修订和回归测试，改进后的装置又重新接受系统验证，才形成从需求到研发、从部署到运行、再回到设计的完整闭环。

**装置工程的责任对象，不是“把一台设备做出来”，而是让一个具有明确能力、边界、接口和生命周期的系统成员，在真实电网中长期与其他对象共同实现系统目标。**

'''

          marker = '## 六、潮流、机电暂态与电磁暂态：为什么模型必须并存'
          if marker not in text:
              raise RuntimeError('Renumbered model chapter marker not found.')
          text = text.replace(marker, chapter + marker, 1)

          # Guard against accidental duplicate/failed insertion.
          if text.count('## 五、装置工程：装置为什么不能脱离系统单独设计') != 1:
              raise RuntimeError('Unexpected device engineering chapter count.')

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit article and rebuild Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- '论系统工程.md'; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '论系统工程.md'
          git commit -m "Add device engineering chapter to system engineering article [skip ci]"
          git push

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28"
