name: Revise system engineering device chapter

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/revise-system-engineering-device.yml'

permissions:
  contents: write
  pages: write

jobs:
  revise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revise article
        env:
          CHAPTER_Z: >-
            
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, os, re, zlib

          p = Path('论系统工程.md')
          text = p.read_text(encoding='utf-8')

          if '## 五、装置工程：装置为什么不能脱离系统单独设计' in text:
              print('Device engineering chapter already present; no article change required.')
              raise SystemExit(0)

          old_intro = '全文可以分三层阅读。第一章先说明需求、边界和责任；第二至四章讨论真实电网在频率、电压和故障防御问题中怎样运动；第五至七章讨论我们怎样选择模型、管理多版本电网并让工业软件进入安全闭环；第八章辨析数字孪生，第九章再把前面的案例收束为一条工程证据链。'
          placeholder = '__DEVICE_ENGINEERING_NEW_INTRO__'
          if old_intro not in text:
              raise RuntimeError('Expected article overview paragraph not found.')
          text = text.replace(old_intro, placeholder, 1)

          text = text.replace('seo_title: "论电力系统工程：从系统工程主线到频率、电压、安全防线、模型、软件与数字孪生｜邹德虎 Dehu Zou"',
                              'seo_title: "论电力系统工程：从系统工程主线到频率、电压、安全防线、装置、模型、软件与数字孪生｜邹德虎 Dehu Zou"', 1)
          text = text.replace('description: "从需求、边界、模型、接口、反馈、约束、验证与运行演化出发，以频率响应、电压控制、安全防线、分层仿真、模型管理、工业软件和数字孪生为线索，讨论电力系统工程的方法与证据闭环。"',
                              'description: "从需求、边界、模型、接口、反馈、约束、验证与运行演化出发，以频率响应、电压控制、安全防线、装置工程、分层仿真、模型管理、工业软件和数字孪生为线索，讨论电力系统工程的方法与证据闭环。"', 1)
          text = re.sub(r'^updated:\s*"?[0-9-]+"?\s*$', 'updated: "2026-09-16"', text, count=1, flags=re.M)
          text = re.sub(r'<span>修订：[0-9-]+</span>', '<span>修订：2026-09-16</span>', text, count=1)

          for old, new in [('## 九、', '## 十、'), ('## 八、', '## 九、'), ('## 七、', '## 八、'), ('## 六、', '## 七、'), ('## 五、', '## 六、')]:
              text = text.replace(old, new)
          for old, new in [('第九章', '第十章'), ('第八章', '第九章'), ('第七章', '第八章'), ('第六章', '第七章'), ('第五章', '第六章')]:
              text = text.replace(old, new)

          new_intro = '全文可以分三层阅读。第一章先说明需求、边界和责任；第二至四章讨论真实电网在频率、电压和故障防御问题中怎样运动；第五章讨论系统功能怎样落实到具体装置，以及装置研发、部署和运行为什么仍然是系统工程；第六至八章讨论我们怎样选择模型、管理多版本电网并让工业软件进入安全闭环；第九章辨析数字孪生，第十章再把前面的案例收束为一条工程证据链。'
          text = text.replace(placeholder, new_intro, 1)

          chapter = zlib.decompress(base64.b64decode(os.environ['CHAPTER_Z'])).decode('utf-8')
          marker = '## 六、潮流、机电暂态与电磁暂态：为什么模型必须并存'
          if marker not in text:
              raise RuntimeError('Renumbered model chapter marker not found.')
          text = text.replace(marker, chapter + marker, 1)

          if text.count('## 五、装置工程：装置为什么不能脱离系统单独设计') != 1:
              raise RuntimeError('Unexpected device engineering chapter count.')

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit article and rebuild Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- '论系统工程.md'; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '论系统工程.md'
          git commit -m "Add device engineering chapter to system engineering article [skip ci]"
          git push

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28"
