name: Retitle English power flow article

on:
  push:
    paths:
      - '.github/workflows/retitle-powerflow.yml'

permissions:
  contents: write

jobs:
  retitle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update article and homepage title
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = 'AC Power Flow from Ybus to Newton: Complex-Matrix Derivatives and Sparse Implementation'
          new = 'From Ybus to an Industrial-Grade Power Flow Solver'

          p = Path('ac-power-flow-ybus-newton.md')
          s = p.read_text(encoding='utf-8')
          if old not in s:
              raise SystemExit('Old article title not found')
          s = s.replace(f'title: "{old}"', f'title: "{new}"', 1)
          s = s.replace(
              f'seo_title: "{old} | Dehu Zou"',
              f'seo_title: "{new} | Dehu Zou"',
              1,
          )
          s = s.replace(f'# {old}', f'# {new}', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if old not in s:
              raise SystemExit('Old homepage title not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

          rm -f .github/workflows/retitle-powerflow.yml

      - name: Validate changes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'title: "From Ybus to an Industrial-Grade Power Flow Solver"' ac-power-flow-ybus-newton.md
          grep -q '# From Ybus to an Industrial-Grade Power Flow Solver' ac-power-flow-ybus-newton.md
          grep -q 'From Ybus to an Industrial-Grade Power Flow Solver' index.html
          ! grep -q 'AC Power Flow from Ybus to Newton: Complex-Matrix Derivatives and Sparse Implementation' index.html

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Retitle English power flow article'
          git push origin main
