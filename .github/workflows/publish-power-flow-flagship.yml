name: Clean temporary power flow publication staging

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-power-flow-flagship.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary publication files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pf-publish
          rm -f assets/code/case3_zou.m
          rm -f assets/code/check_case3_zou.m
          rm -f assets/code/power-flow-verification-results.json
          rm -f assets/code/power_flow_reference.py
          rm -f assets/code/requirements-tested.txt
          rmdir assets/code 2>/dev/null || true
          rmdir assets 2>/dev/null || true
          rm -f .github/workflows/publish-power-flow-flagship.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary power flow publication staging'
          git push origin HEAD:main
