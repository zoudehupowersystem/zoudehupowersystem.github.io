name: Refine industrial power flow section

on:
  push:
    paths:
      - '.github/workflows/refine-industrial-powerflow.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine article
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('ac-power-flow-ybus-newton.md')
          s = p.read_text(encoding='utf-8')

          # Remove the provenance note and everything under it.
          s = re.sub(r'\n---\n\n## Note on provenance\n.*\Z', '\n', s, flags=re.S)

          anchor = '\n---\n\n## 13. The broader lesson: matrix thinking is not shorthand\n'
          if anchor not in s:
              raise SystemExit('Expected section 13 anchor not found')

          industrial = Path('.tmp-industrial-powerflow-section.md').read_text(encoding='utf-8').strip()
          replacement = '\n' + industrial + '\n\n---\n\n## 14. The broader lesson: matrix thinking is not shorthand\n'
          s = s.replace(anchor, replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY

          rm -f .tmp-industrial-powerflow-section.md
          rm -f .github/workflows/refine-industrial-powerflow.yml

      - name: Validate article
        shell: bash
        run: |
          set -euo pipefail
          grep -q '## 13. What an industrial-grade power-flow program must provide' ac-power-flow-ybus-newton.md
          grep -q '## 14. The broader lesson: matrix thinking is not shorthand' ac-power-flow-ybus-newton.md
          ! grep -q '## Note on provenance' ac-power-flow-ybus-newton.md
          grep -q '### 13.4 Sparse linear algebra is a first-class subsystem' ac-power-flow-ybus-newton.md
          grep -q '### 13.9 R&D priorities: optimize the whole solution pipeline' ac-power-flow-ybus-newton.md

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add industrial-grade power flow development guidance'
          git push origin main
