name: Sync article updated dates and sitemaps

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'

permissions:
  contents: write
  pages: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync article dates and regenerate static sitemaps
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import quote, unquote
          from xml.sax.saxutils import escape
          import os, re, subprocess

          before = os.environ['BEFORE_SHA']
          after = os.environ['AFTER_SHA']
          zero = '0' * 40
          if before == zero:
              changed = subprocess.check_output(['git','ls-tree','-r','--name-only',after], text=True).splitlines()
          else:
              changed = subprocess.check_output(['git','diff','--name-only',before,after,'--','*.md','**/*.md'], text=True).splitlines()

          commit_date = subprocess.check_output(['git','show','-s','--format=%cI',after], text=True).strip()[:10]

          # Only real article-content commits update the article's visible date.
          for name in changed:
              p = Path(name)
              if not p.is_file() or p.suffix.lower() != '.md':
                  continue
              text = p.read_text(encoding='utf-8')
              m = re.match(r'^---\n(.*?)\n---\n', text, flags=re.S)
              if not m:
                  continue
              fm = m.group(1)
              if not re.search(r'^layout:\s*(article|manitoba)\s*$', fm, flags=re.M):
                  continue
              if re.search(r'^updated:\s*.*$', fm, flags=re.M):
                  new_fm = re.sub(r'^updated:\s*.*$', f'updated: "{commit_date}"', fm, count=1, flags=re.M)
              else:
                  new_fm = fm + f'\nupdated: "{commit_date}"'
              new_text = '---\n' + new_fm + '\n---\n' + text[m.end():]
              if new_text != text:
                  p.write_text(new_text, encoding='utf-8')

          site = 'https://zoudehupowersystem.github.io'
          static_paths = ['/', '/en.html', '/blog.html', '/english.html']
          article_entries = []

          # Re-read all article front matter after date synchronization.
          for p in sorted(Path('.').rglob('*.md')):
              if '.git' in p.parts:
                  continue
              text = p.read_text(encoding='utf-8')
              m = re.match(r'^---\n(.*?)\n---\n', text, flags=re.S)
              if not m:
                  continue
              fm = m.group(1)
              if not re.search(r'^layout:\s*(article|manitoba)\s*$', fm, flags=re.M):
                  continue

              pm = re.search(r'^permalink:\s*["\']?([^"\'\n]+)["\']?\s*$', fm, flags=re.M)
              path = pm.group(1).strip() if pm else '/' + p.stem + '.html'
              if not path.startswith('/'):
                  path = '/' + path
              encoded_path = quote(unquote(path), safe='/-._~')

              um = re.search(r'^updated:\s*["\']?([^"\'\n]+)["\']?\s*$', fm, flags=re.M)
              updated = um.group(1).strip()[:10] if um else None
              article_entries.append((site + encoded_path, updated))

          article_entries.sort(key=lambda x: x[0])

          xml = ['<?xml version="1.0" encoding="UTF-8"?>',
                 '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for path in static_paths:
              xml += ['  <url>', f'    <loc>{escape(site + path)}</loc>', '  </url>']
          for loc, updated in article_entries:
              xml += ['  <url>', f'    <loc>{escape(loc)}</loc>']
              if updated:
                  xml.append(f'    <lastmod>{escape(updated)}</lastmod>')
              xml.append('  </url>')
          xml.append('</urlset>')
          Path('sitemap.xml').write_text('\n'.join(xml) + '\n', encoding='utf-8')

          txt_urls = [site + p for p in static_paths] + [loc for loc, _ in article_entries]
          Path('sitemap.txt').write_text('\n'.join(txt_urls) + '\n', encoding='utf-8')
          PY

      - name: Commit synchronized metadata and rebuild Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.md' '**/*.md' sitemap.xml sitemap.txt
          git commit -m "Sync article dates and static sitemaps [skip ci]"
          git push

          # A push made by GITHUB_TOKEN does not normally trigger another workflow.
          # Request a Pages build explicitly so the published sitemap and bylines
          # immediately reflect the synchronized front matter.
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28"
