name: Sync article updated dates and sitemaps

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'index.html'
      - 'en.html'
      - 'blog.html'
      - 'english.html'
      - '.github/workflows/sync-article-updated.yml'

permissions:
  contents: write
  pages: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync article dates and regenerate static sitemaps
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import quote, unquote
          from xml.sax.saxutils import escape
          import os, re, subprocess

          before = os.environ['BEFORE_SHA']
          after = os.environ['AFTER_SHA']
          zero = '0' * 40
          if before == zero:
              changed = subprocess.check_output(
                  ['git', 'ls-tree', '-r', '--name-only', after], text=True
              ).splitlines()
          else:
              changed = subprocess.check_output(
                  ['git', 'diff', '--name-only', before, after, '--', '*.md', '**/*.md'],
                  text=True,
              ).splitlines()

          commit_date = subprocess.check_output(
              ['git', 'show', '-s', '--format=%cI', after], text=True
          ).strip()[:10]

          # Only real article-content commits update the article's visible date.
          for name in changed:
              p = Path(name)
              if not p.is_file() or p.suffix.lower() != '.md':
                  continue
              text = p.read_text(encoding='utf-8')
              m = re.match(r'^---\n(.*?)\n---\n', text, flags=re.S)
              if not m:
                  continue
              fm = m.group(1)
              if not re.search(r'^layout:\s*(article|manitoba)\s*$', fm, flags=re.M):
                  continue
              if re.search(r'^updated:\s*.*$', fm, flags=re.M):
                  new_fm = re.sub(
                      r'^updated:\s*.*$',
                      f'updated: "{commit_date}"',
                      fm,
                      count=1,
                      flags=re.M,
                  )
              else:
                  new_fm = fm + f'\nupdated: "{commit_date}"'
              new_text = '---\n' + new_fm + '\n---\n' + text[m.end():]
              if new_text != text:
                  p.write_text(new_text, encoding='utf-8')

          site = 'https://zoudehupowersystem.github.io'
          static_pages = [
              ('/', 'index.html'),
              ('/en.html', 'en.html'),
              ('/blog.html', 'blog.html'),
              ('/english.html', 'english.html'),
          ]

          def git_lastmod(source):
              p = Path(source)
              if not p.is_file():
                  return None
              value = subprocess.check_output(
                  ['git', 'log', '-1', '--format=%cI', '--', source], text=True
              ).strip()
              return value[:10] if value else None

          static_entries = [
              (site + path, git_lastmod(source)) for path, source in static_pages
          ]

          # Use the canonical URL as the key. This guarantees that each URL appears
          # only once even if stale or conflicting source files share a permalink.
          article_by_loc = {}
          article_sources = {}

          # Re-read all article front matter after date synchronization.
          for p in sorted(Path('.').rglob('*.md')):
              if '.git' in p.parts:
                  continue
              text = p.read_text(encoding='utf-8')
              m = re.match(r'^---\n(.*?)\n---\n', text, flags=re.S)
              if not m:
                  continue
              fm = m.group(1)
              if not re.search(r'^layout:\s*(article|manitoba)\s*$', fm, flags=re.M):
                  continue

              pm = re.search(r'^permalink:\s*["\']?([^"\'\n]+)["\']?\s*$', fm, flags=re.M)
              path = pm.group(1).strip() if pm else '/' + p.stem + '.html'
              if not path.startswith('/'):
                  path = '/' + path
              encoded_path = quote(unquote(path), safe='/-._~')
              loc = site + encoded_path

              um = re.search(r'^updated:\s*["\']?([^"\'\n]+)["\']?\s*$', fm, flags=re.M)
              updated = um.group(1).strip()[:10] if um else None

              article_sources.setdefault(loc, []).append(str(p))
              previous = article_by_loc.get(loc)
              if previous is None:
                  article_by_loc[loc] = updated
              elif updated and (not previous or updated > previous):
                  article_by_loc[loc] = updated

          for loc, sources in sorted(article_sources.items()):
              if len(sources) > 1:
                  print(
                      f'::warning title=Duplicate canonical URL::{loc} is produced by: '
                      + ', '.join(sources)
                  )

          article_entries = sorted(article_by_loc.items(), key=lambda x: x[0])

          xml = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">',
          ]
          for loc, updated in static_entries + article_entries:
              xml += ['  <url>', f'    <loc>{escape(loc)}</loc>']
              if updated:
                  xml.append(f'    <lastmod>{escape(updated)}</lastmod>')
              xml.append('  </url>')
          xml.append('</urlset>')
          Path('sitemap.xml').write_text('\n'.join(xml) + '\n', encoding='utf-8')

          txt_urls = [loc for loc, _ in static_entries + article_entries]
          if len(txt_urls) != len(set(txt_urls)):
              raise RuntimeError('sitemap generation produced duplicate URLs')
          Path('sitemap.txt').write_text('\n'.join(txt_urls) + '\n', encoding='utf-8')
          PY

      - name: Commit synchronized metadata and rebuild Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.md' '**/*.md' sitemap.xml sitemap.txt
          git commit -m "Sync article dates and static sitemaps [skip ci]"
          git push

          # A push made by GITHUB_TOKEN does not normally trigger another workflow.
          # Request a Pages build explicitly so the published sitemap and bylines
          # immediately reflect the synchronized front matter.
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28"
