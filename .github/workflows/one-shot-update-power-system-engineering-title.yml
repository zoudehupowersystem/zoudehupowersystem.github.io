name: One-shot homepage article title sync

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-update-power-system-engineering-title.yml'

permissions:
  contents: write
  pages: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Chinese and English homepage article titles
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = '<span>论系统工程</span>'
          new = '<span>论电力系统工程</span>'
          if old not in text:
              raise SystemExit('Expected Chinese homepage title not found')
          text = text.replace(old, new)
          text = text.replace('"dateModified": "2026-09-09T19:37:00+08:00"', '"dateModified": "2026-09-15T09:55:00+08:00"')
          index.write_text(text, encoding='utf-8')

          en = Path('en.html')
          text = en.read_text(encoding='utf-8')
          old = '<span>On Systems Engineering</span>'
          new = '<span>On Power System Engineering</span>'
          if old not in text:
              raise SystemExit('Expected English homepage title not found')
          text = text.replace(old, new)
          text = text.replace('"dateModified": "2026-09-09T19:37:00+08:00"', '"dateModified": "2026-09-15T09:55:00+08:00"')
          en.write_text(text, encoding='utf-8')
          PY
      - name: Commit homepage updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html en.html
          git commit -m "Update homepage title for 论电力系统工程"
          git push
