name: Revise PSCAD 2026 sale context

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/revise-pscad-2026-sale.yml'

permissions:
  contents: write
  pages: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bilingual article revision
        run: python3 scripts/revise_pscad_2026_sale.py
      - name: Commit article revision and rebuild Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '曼尼托巴水电局的创业史.md' 'manitoba-hydro-pscad-rtds-history.md'
          git commit -m "Add 2026 PSCAD sale-offer context and trim wave comparison"
          git push
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28"
