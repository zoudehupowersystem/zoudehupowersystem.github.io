name: Refine root-site SEO

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-refine.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refine metadata and brand identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          orcid = 'https://orcid.org/0000-0002-3359-0145'
          github = 'https://github.com/zoudehupowersystem'
          same_old = f'"sameAs": ["{github}"]'
          same_new = f'"sameAs": ["{orcid}", "{github}"]'

          # Strengthen entity identity across homepage/article structured data.
          for fn in ['index.html', '_layouts/article.html', '_layouts/manitoba.html']:
              p = Path(fn)
              s = p.read_text(encoding='utf-8')
              s = s.replace(same_old, same_new)
              p.write_text(s, encoding='utf-8')

          # Homepage: crawler and social metadata.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'max-image-preview:large' not in s:
              s = s.replace(
                  '  <meta name="theme-color" content="#0B1F3A" />\n',
                  '  <meta name="theme-color" content="#0B1F3A" />\n'
                  '  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />\n'
                  f'  <link rel="me" href="{orcid}" />\n'
              )
          if 'og:site_name' not in s:
              s = s.replace(
                  '  <meta property="og:type" content="profile" />\n',
                  '  <meta property="og:type" content="profile" />\n'
                  '  <meta property="og:site_name" content="邹德虎 · Dehu Zou" />\n'
              )
          if 'twitter:card' not in s:
              needle = '  <meta property="og:image" content="https://zoudehupowersystem.github.io/zoudehu.jpg" />\n'
              extra = (
                  needle +
                  '  <meta name="twitter:card" content="summary_large_image" />\n'
                  '  <meta name="twitter:title" content="邹德虎（Dehu Zou）｜电力系统仿真、调度自动化与工业软件研发" />\n'
                  '  <meta name="twitter:description" content="电力系统建模仿真、实时 EMT、调度自动化与工业软件研发。" />\n'
                  '  <meta name="twitter:image" content="https://zoudehupowersystem.github.io/zoudehu.jpg" />\n'
              )
              s = s.replace(needle, extra)
          p.write_text(s, encoding='utf-8')

          # Article layouts: crawler/social metadata with dynamic title/description.
          configs = [
              ('_layouts/article.html', '邹德虎 / Dehu Zou'),
              ('_layouts/manitoba.html', 'Dehu Zou / 邹德虎'),
          ]
          for fn, author_text in configs:
              p = Path(fn)
              s = p.read_text(encoding='utf-8')
              if 'max-image-preview:large' not in s:
                  s = s.replace(
                      f'  <meta name="author" content="{author_text}" />\n',
                      f'  <meta name="author" content="{author_text}" />\n'
                      '  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />\n'
                      f'  <link rel="me" href="{orcid}" />\n'
                  )
              if 'og:site_name' not in s:
                  s = s.replace(
                      '  <meta property="og:type" content="article" />\n',
                      '  <meta property="og:type" content="article" />\n'
                      '  <meta property="og:site_name" content="邹德虎 · Dehu Zou" />\n'
                  )
              if 'twitter:card' not in s:
                  needle = '  <meta property="og:url" content="https://zoudehupowersystem.github.io{{ page.url }}" />\n'
                  extra = (
                      needle +
                      '  <meta property="og:image" content="https://zoudehupowersystem.github.io/zoudehu.jpg" />\n'
                      '  <meta name="twitter:card" content="summary_large_image" />\n'
                      '  <meta name="twitter:title" content="{{ seo_title | escape }}" />\n'
                      '  <meta name="twitter:description" content="{{ seo_description | escape }}" />\n'
                      '  <meta name="twitter:image" content="https://zoudehupowersystem.github.io/zoudehu.jpg" />\n'
                  )
                  s = s.replace(needle, extra)
              p.write_text(s, encoding='utf-8')
          PY

          cat > README.md <<'EOF'
          # Dehu Zou · 邹德虎 — Personal Website

          Source repository for the personal homepage and technical blog of Dehu Zou (邹德虎), focusing on power systems, real-time EMT simulation, grid dispatch automation, and industrial software engineering.

          **Website:** https://zoudehupowersystem.github.io/

          **ORCID:** https://orcid.org/0000-0002-3359-0145

          The site is built with GitHub Pages / Jekyll. Blog articles are maintained as Markdown with stable `.html` permalinks.
          EOF

          cat > 404.html <<'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <meta name="robots" content="noindex,follow" />
            <title>页面未找到｜邹德虎 Dehu Zou</title>
            <style>
              body{font-family:system-ui,-apple-system,"Segoe UI",Arial,"Microsoft YaHei",sans-serif;max-width:760px;margin:80px auto;padding:0 22px;color:#20242a;line-height:1.8}
              a{color:#155eef} code{background:#f3f4f6;padding:.15em .35em;border-radius:4px}
            </style>
          </head>
          <body>
            <h1>页面未找到</h1>
            <p>该页面可能已经迁移或地址有误。</p>
            <p><a href="/">返回邹德虎个人主页 · Dehu Zou</a></p>
          </body>
          </html>
          EOF

          rm -f .github/workflows/seo-refine.yml

      - name: Validate SEO metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'https://orcid.org/0000-0002-3359-0145' index.html
          grep -q 'twitter:card' index.html
          grep -q 'twitter:card' _layouts/article.html
          grep -q 'max-image-preview:large' _layouts/article.html
          test -f 404.html

      - name: Commit refinements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine SEO metadata, entity identity, and site navigation'
          git push origin main
