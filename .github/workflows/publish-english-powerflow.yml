name: Publish English power flow article

on:
  push:
    paths:
      - '.github/workflows/publish-english-powerflow.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update layout, homepage and sitemaps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Make the shared article layout language-aware.
          p = Path('_layouts/article.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<html lang="zh-CN">', '<html lang="{{ page.lang | default: \'zh-CN\' }}">', 1)
          s = s.replace('    "inLanguage": "zh-CN"', '    "inLanguage": {{ page.lang | default: \'zh-CN\' | jsonify }}', 1)
          if '<meta property="og:locale"' not in s:
              s = s.replace(
                  '  <meta property="og:site_name" content="邹德虎 · Dehu Zou" />\n',
                  '  <meta property="og:site_name" content="邹德虎 · Dehu Zou" />\n'
                  '  <meta property="og:locale" content="{% if page.lang == \'en\' %}en_US{% else %}zh_CN{% endif %}" />\n',
                  1,
              )
          new_header = '''<header class="blog-header" aria-label="{% if page.lang == 'en' %}Power systems blog{% else %}博客主题栏目{% endif %}">
              {% if page.lang == 'en' %}
              <div class="kicker">POWER SYSTEMS · FEATURED COLUMN</div>
              <div class="brand">Dehu Zou's Blog</div>
              <div class="topics">Power Systems · Engineering · Computing &amp; Simulation</div>
              <a class="home" href="{{ '/' | relative_url }}">← Personal Website</a>
              {% else %}
              <div class="kicker">主题栏目 · FEATURED COLUMN</div>
              <div class="brand">邹德虎的博客 · Dehu Zou's Blog</div>
              <div class="topics">电力系统 · 工程技术 · 计算与仿真</div>
              <a class="home" href="{{ '/' | relative_url }}">← 返回个人主页 · Home</a>
              {% endif %}
            </header>'''
          s2, n = re.subn(r'<header class="blog-header"[^>]*>.*?</header>', new_header, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected one article header block, found {n}')
          p.write_text(s2, encoding='utf-8')

          # 2) Add the English flagship article to the power-system principles section.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('精选 4 篇 · 全部文章按主题浏览，共 29 篇。', '精选 4 篇 · 全部文章按主题浏览，共 30 篇。', 1)

          section_start = s.index('<section class="article-group" aria-label="电力系统原理与计算">')
          section_end = s.index('</section>', section_start) + len('</section>')
          section = s[section_start:section_end]
          if 'ac-power-flow-ybus-newton.html' not in section:
              grid = '<div class="articles-grid" role="list">'
              article_link = '''<div class="articles-grid" role="list">
              <a class="article-item" role="listitem" href="ac-power-flow-ybus-newton.html">
                <span>AC Power Flow from Ybus to Newton: Complex-Matrix Derivatives and Sparse Implementation</span><small>EN · NEW</small>
              </a>'''
              if grid not in section:
                  raise SystemExit('Power-system article grid not found')
              section = section.replace(grid, article_link, 1)
          section = section.replace('<div class="article-group-count">10 篇</div>', '<div class="article-group-count">11 篇</div>', 1)
          s = s[:section_start] + section + s[section_end:]
          p.write_text(s, encoding='utf-8')

          # 3) Add the new public URL to both static sitemap formats.
          url = 'https://zoudehupowersystem.github.io/ac-power-flow-ybus-newton.html'
          p = Path('sitemap.xml')
          s = p.read_text(encoding='utf-8')
          if url not in s:
              entry = f'  <url>\n    <loc>{url}</loc>\n  </url>\n'
              s = s.replace('</urlset>', entry + '</urlset>', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('sitemap.txt')
          s = p.read_text(encoding='utf-8')
          if url not in s:
              if s and not s.endswith('\n'):
                  s += '\n'
              s += url + '\n'
          p.write_text(s, encoding='utf-8')
          PY

          rm -f .github/workflows/publish-english-powerflow.yml

      - name: Validate changes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'lang: en' ac-power-flow-ybus-newton.md
          grep -q 'AC Power Flow from Ybus to Newton' index.html
          grep -q 'article-group-count">11 篇' index.html
          grep -q '共 30 篇' index.html
          grep -q 'ac-power-flow-ybus-newton.html' sitemap.xml
          grep -q 'ac-power-flow-ybus-newton.html' sitemap.txt
          grep -q "page.lang | default" _layouts/article.html
          grep -q 'en_US' _layouts/article.html

      - name: Commit publication updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish English AC power flow flagship article'
          git push origin main
