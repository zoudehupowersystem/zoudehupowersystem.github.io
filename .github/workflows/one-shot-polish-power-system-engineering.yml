name: One-shot polish power system engineering article

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-polish-power-system-engineering.yml'

permissions:
  contents: write
  pages: write

jobs:
  revise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revise and flatten article
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/revise_power_system_engineering.py')
          text = p.read_text(encoding='utf-8')
          needle = "refs = refs.replace('公开网页核查日期为 2026-09-08', '公开网页核查日期为 2026-09-15')"
          patch = needle + "\nrefs = refs.replace('并非调用 MATPOWER 所得。', '未调用 MATPOWER。')"
          if needle not in text:
              raise SystemExit('reference patch point not found')
          text = text.replace(needle, patch, 1)
          old = "自动电压控制 AVC 的价值，不是比本地 AVR 更频繁地修改给定值，而是协调多个资源在网络中的作用。"
          new = "自动电压控制 AVC 的价值在于协调多个资源在网络中的作用，不能简化为比本地 AVR 更频繁地修改给定值。"
          text = text.replace("    '### 6. AVC 应当分配可实现的任务，而不是重复下达愿望': '### 6. AVC 应当分配可实现的任务',", "    '### 6. AVC 应当分配可实现的任务，而不是重复下达愿望': '### 6. AVC 应当分配可实现的任务',\n    '" + old + "': '" + new + "',")
          p.write_text(text, encoding='utf-8')
          PY
          python3 tools/revise_power_system_engineering.py

      - name: Validate source
        run: |
          grep -q '^title: "论电力系统工程"' '论系统工程.md'
          grep -q '^## 八、数字孪生辨析：数字表示怎样持续贴近真实电网$' '论系统工程.md'
          grep -q '^## 九、把六个案例收束为一条工程证据链$' '论系统工程.md'
          grep -q '^## 十、结语：把复杂性变成可以承担的责任$' '论系统工程.md'
          grep -q 'ISO/IEC 30173:2023' '论系统工程.md'
          grep -q 'NIST IR 8356' '论系统工程.md'
          test ! -e '_includes/system-engineering-legacy.md'
          ! grep -q 'legacy_sections\|system-engineering-legacy' '论系统工程.md'
          ! grep -q '并非' '论系统工程.md'
          ! grep -Pq '不是[^。\n]{0,80}而是' '论系统工程.md'

      - name: Commit revised article and remove one-shot files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/revise_power_system_engineering.py
          git rm .github/workflows/one-shot-polish-power-system-engineering.yml
          git add '论系统工程.md' _includes
          git commit -m "Restructure and polish 论电力系统工程"
          git push

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" >/dev/null
